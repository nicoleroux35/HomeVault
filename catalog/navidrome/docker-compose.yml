services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    restart: unless-stopped
    ports:
      - "{{PORT}}:4533"
    volumes:
      - {{DATA_DIR}}/data:/data
      - {{DATA_DIR}}/music:/music:ro
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
