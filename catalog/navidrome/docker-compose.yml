services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    restart: unless-stopped
    ports:
      - "{{PORT}}:4533"
    volumes:
      - {{DATA_DIR}}/data:/data
      # Music library: the HomeVault share the admin picked at install time
      # (read-only: Navidrome only reads the files).
      - {{SHARE_DIR}}:/music:ro
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
