services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    ports:
      - "{{PORT}}:80"
    environment:
      - SIGNUPS_ALLOWED=true
    volumes:
      - {{DATA_DIR}}/data:/data
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
