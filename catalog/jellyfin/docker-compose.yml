services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - "{{PORT}}:8096"
    volumes:
      - {{DATA_DIR}}/config:/config
      - {{DATA_DIR}}/cache:/cache
      # Library: the HomeVault share the admin picked at install time
      # (read-only: a media server never edits the user's files).
      - {{SHARE_DIR}}:/media:ro
    {{GPU_DEVICES}}
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
