manifest_version = 1
id = "vikunja"
name = "Vikunja"
version = "1.0.0"
category = "productivity"
icon = "list-checks"
app_port = 3456
default_port = 3456
arch = ["amd64", "arm64", "armv7"]
gpu = false
developer = "Vikunja"
website = "https://vikunja.io"
repo = "https://code.vikunja.io/vikunja"
description = "Self-hosted to-do list and task management app."
description_fr = "Application de gestion de tâches et de listes à faire auto-hébergée."
description_de = "Selbstgehostete To-do-Listen- und Aufgabenverwaltungs-App."
description_es = "Aplicación autoalojada de listas de tareas y gestión de tareas."
tagline = "Self-hosted to-do list and task management app."

# Docker hardening (HomeVault's `[security]`, DSM7-style privilege
# declaration). `no_new_privileges` defaults to true; `cap_drop`, `cap_add`,
# `user` and `read_only` are opt-in and validated at manifest load.
[security]
no_new_privileges = true
