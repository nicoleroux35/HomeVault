services:
  vikunja:
    image: vikunja/vikunja:latest
    container_name: vikunja
    restart: unless-stopped
    ports:
      - "{{PORT}}:3456"
    environment:
      - VIKUNJA_SERVICE_JWTSECRET=changeme
      - VIKUNJA_SERVICE_PUBLICURL=http://localhost:{{PORT}}
    volumes:
      - {{DATA_DIR}}/files:/app/vikunja/files
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
