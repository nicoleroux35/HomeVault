name: CI

# Continuous integration: build + test + dependency vulnerability scan for
# both the Rust backend and the Svelte frontend. Maps to the CLAUDE.md
# "Compliance & security baseline" (NIST SSDF 800-218 for the build
# pipeline; ISO/IEC 27002 secure development & vulnerability management;
# OWASP CI/CD).

on:
  push:
    branches: [main, "checkpoint-*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    name: Rust — build, test, clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        # One --component per flag: rustup treats a bare trailing value as
        # another positional TOOLCHAIN (`--component clippy rustfmt` fails
        # with "invalid toolchain name: 'rustfmt'").
        run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all --check
        continue-on-error: true
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        continue-on-error: true
      - name: Build
        run: cargo build --locked --all-targets
      - name: Unit + integration tests
        run: cargo test --locked
        # The E2E Playwright suites need a live server + host tools
        # (sudo, mdadm, clamav, …) and are run separately, not in CI.

  backend-audit:
    name: Rust — cargo audit (advisory scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: rustup toolchain install stable --profile minimal && cargo install cargo-audit --locked
      - name: Audit dependencies (RUSTSEC)
        # RUSTSEC-2026-0285 (rustls) is fixed by the Cargo.lock bump to
        # >=0.23.45. The two ignored advisories are "unmaintained" warnings
        # with no known vulnerability: paste is transitive (pulp/rav1e) and
        # rustls-pemfile is a direct dependency with no maintained
        # successor yet. All other denied warnings still fail the job.
        run: cargo audit --deny warnings --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2025-0134

  frontend:
    name: Frontend — type-check, build, npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Type-check (svelte-check + tsc)
        run: npm run check
      - name: Build
        run: npm run build
      - name: npm audit (high+ severity)
        run: npm audit --audit-level=high
        continue-on-error: true

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
