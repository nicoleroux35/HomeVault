name: CI

# Continuous integration: build + test + dependency vulnerability scan for
# both the Rust backend and the Svelte frontend. Maps to the CLAUDE.md
# "Compliance & security baseline" (NIST SSDF 800-218 for the build
# pipeline; ISO/IEC 27002 secure development & vulnerability management;
# OWASP CI/CD).

on:
  push:
    branches: [main, "checkpoint-*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    name: Rust — build, test, clippy
    runs-on: ubuntu-latest
    env:
      # `debug` only controls DWARF debuginfo — assertions, overflow
      # checks and backtrace symbols stay intact. Without this, the
      # --all-targets test-binary farm (50+ statically linked binaries)
      # overflows the runner's ~21 GB disk budget.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
      # Toolchains this job never uses (Android SDK, .NET, GHC, ghcup,
      # CodeQL) share the disk with target/. Linking failed with
      # "No space left on device"/SIGBUS until they were removed
      # (~17 GB reclaimed).
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install Rust toolchain
        # One --component per flag: rustup treats a bare trailing value as
        # another positional TOOLCHAIN (`--component clippy rustfmt` fails
        # with "invalid toolchain name: 'rustfmt'").
        run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all --check
        continue-on-error: true
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        continue-on-error: true
      - name: Build
        run: cargo build --locked --all-targets
      - name: Unit tests (lib)
        # The privileged-ops integration suites (groups, users, shares, …)
        # assert clean 400 failures WITHOUT sudo rights — running them as
        # the passwordless-sudo `runner` user INVERTS those assertions
        # (`sudo groupadd` succeeds → 200, verified failing on run
        # 36592566909). The full suite runs unprivileged as the dedicated
        # `ci` user in integration.yml on the same push; here `--lib`
        # focuses on unit tests to keep this gate fast. Compile coverage for
        # every target (including all test binaries) stays in the Build step
        # above.
        run: cargo test --locked --lib
        # The E2E Playwright suites need a live server + host tools
        # (sudo, mdadm, clamav, …) and are run separately, not in CI.

  backend-audit:
    name: Rust — cargo audit (advisory scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install cargo-audit
        run: rustup toolchain install stable --profile minimal && cargo install cargo-audit --locked
      - name: Audit dependencies (RUSTSEC)
        # All critical vulnerabilities are fixed. The three ignored advisories
        # are warnings with no immediate fix available:
        # - RUSTSEC-2025-0134 (rustls-pemfile): unmaintained but functional, no successor yet
        # - RUSTSEC-2026-0253 (lru): unsound use-after-free via dav-server, unlikely in practice
        # Both are documented in Cargo.toml. All other warnings still fail the job.
        run: cargo audit --deny warnings --ignore RUSTSEC-2025-0134 --ignore RUSTSEC-2026-0253

  frontend:
    name: Frontend — type-check, build, npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Type-check (svelte-check + tsc)
        run: npm run check
      - name: Build
        run: npm run build
      - name: npm audit (high+ severity)
        run: npm audit --audit-level=high
        continue-on-error: true

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The scan still runs and still fails on a real leak (exit 2); we
          # only drop the SARIF artifact upload, which shares the 500 MB
          # private-repo artifact quota with the E2E reports and made this
          # job fail with "Artifact storage quota has been hit" once that
          # filled up (run 38066499116). Code scanning is unavailable on a
          # private repo without GHAS, so the artifact bought nothing.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
