# E2E — real browsers (Playwright). Official image with browsers preinstalled.
# GitHub-hosted mirror of .gitea/workflows/e2e-playwright.yml.
# Runs only on main pushes, PRs and manually: it is the most expensive stage
# (frontend build + Rust build + full spec run) and is gated after
# unit/component/integration in full-pipeline.yml.
# HomeVault specifics:
# - `PORT` sets the HTTP listen port (default 8080, see src/config/settings.rs),
#   `DATA_DIRECTORY` isolates server data on a scratch dir (never real data).
# - `frontend build` emits ../static/dist, which the Rust binary embeds via
#   include_dir, so the binary under test serves the real UI.
# - Repo pins @playwright/test 1.62 while the image ships 1.49 browsers, hence
#   the explicit `playwright install` step (OS deps are already in the image).
# - Real browsers, not emulated Chromium: playwright.config.ts runs the
#   `firefox` + `chromium` projects.
# GitHub differences vs Gitea: none in the steps (container jobs run as root
# on both); the artifact upload works natively here, so no continue-on-error.
name: e2e
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.49.0-noble
    env:
      BASE_URL: http://localhost:8080
      E2E_ADMIN_USER: e2eadmin
      E2E_ADMIN_PASS: E2eSecret123
      CI: "true"
      # Container jobs run as root, but the Playwright image's $HOME
      # (/github/home) belongs to pwuser: Firefox refuses to launch in a
      # "regular user's session" (Playwright's documented workaround is
      # HOME=/root). Chromium is unaffected; Firefox specs all fail
      # without this.
      HOME: /root
      # Strip debuginfo from target/ (browser downloads + node_modules +
      # cargo target share the runner disk). Only `cargo build` runs here,
      # i.e. the dev profile; assertions are a separate profile key.
      CARGO_PROFILE_DEV_DEBUG: "0"
      # security.spec.ts keeps its scratch dir out of $HOME on CI: /root is
      # not an explorer allowed root (src/config/explorer_config.rs), so the
      # honeypot POST in test 4.3 needs a workdir under an allowed root —
      # /home exists in the image and is on the default list.
      HV_E2E_WORKROOT: /home/hv-e2e-security
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust build deps
        # sudo: without the binary, setup-status reports sudo_available=false
        # and the wizard shows a prereq banner that breaks strict locators.
        run: apt-get update && apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev curl git ca-certificates xz-utils sudo
      # Direct Node tarball — see component.yml: always install the pinned
      # build. The Playwright image's node v22.11.0 is BELOW vite 8's
      # required >=22.12 and yields a broken rolldown native binding.
      - name: Install Node 22
        run: |
          curl -fsSL https://nodejs.org/dist/v22.23.3/node-v22.23.3-linux-x64.tar.xz -o /tmp/node.tar.xz
          rm -rf /opt/node-v22.23.3-linux-x64
          tar -xJf /tmp/node.tar.xz -C /opt
          rm -f /tmp/node.tar.xz
          for b in node npm npx; do ln -sf /opt/node-v22.23.3-linux-x64/bin/$b /usr/local/bin/$b; done
          node --version && npm --version
      - name: Install Rust toolchain
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install stable --profile minimal
          # Put cargo/rustc on the default PATH so later steps always find them.
          for t in cargo rustc rustup; do ln -sf "$HOME/.cargo/bin/$t" /usr/local/bin/$t 2>/dev/null || true; done
      - name: Install Playwright runner (root)
        run: npm ci
      - name: Install frontend deps
        run: cd frontend && npm ci
      - name: Build frontend (embedded as static/dist)
        run: cd frontend && npm run build
      - name: Install browsers matching @playwright/test
        run: npx playwright install chromium firefox
      - name: Build backend
        run: export PATH="$HOME/.cargo/bin:$PATH" && cargo build --locked
      # Nothing after this point needs cargo or the package caches, and the
      # first 5 h stage B hit ENOSPC mid-run (rustup + caches + test
      # artifacts exhausted the runner disk; ~80 tests died of it). Reclaim
      # several GB: target/debug/deps only matters for linking, the binary
      # is already built.
      - name: Free disk space before the spec run
        run: |
          rm -rf "$HOME/.rustup" "$HOME/.cargo/registry" "$HOME/.cargo/git" "$HOME/.npm"
          rm -rf target/debug/deps target/debug/incremental
          apt-get clean && rm -rf /var/lib/apt/lists/*
          df -h /
      - name: Start server (scratch data dir)
        run: |
          mkdir -p /tmp/hv-e2e-data
          DATA_DIRECTORY=/tmp/hv-e2e-data PORT=8080 ./target/debug/homevault > /tmp/hv-e2e.log 2>&1 &
          echo $! > /tmp/hv-e2e.pid
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/api/health >/dev/null && break
            sleep 2
          done
          curl -sf http://localhost:8080/api/health >/dev/null
          # Warm the cold debug build before the tight spec timeouts start.
          curl -sf http://localhost:8080/ -o /dev/null
          curl -sf http://localhost:8080/api/auth/setup-status -o /dev/null
      # Stage A — setup wizard on a truly fresh server. 19.1 completes
      # first-run (random admin), so stage B below uses a second fresh
      # server for everything else.
      - name: E2E stage A — setup wizard
        run: npx playwright test tests/e2e/setup --reporter=html --retries=1
      - name: Reset server + seed e2eadmin
        run: |
          kill $(cat /tmp/hv-e2e.pid) || true
          sleep 2
          rm -rf /tmp/hv-e2e-data && mkdir -p /tmp/hv-e2e-data
          DATA_DIRECTORY=/tmp/hv-e2e-data PORT=8080 ./target/debug/homevault > /tmp/hv-e2e.log 2>&1 &
          echo $! > /tmp/hv-e2e.pid
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/api/health >/dev/null && break
            sleep 2
          done
          # Every non-setup spec logs in as e2eadmin in beforeAll ("seed this
          # account first") — the wizard is gone now, so seed via the API,
          # exactly like tests/setup_integration.rs does.
          for i in $(seq 1 15); do
            SEED=$(curl -sf -X POST http://localhost:8080/api/auth/setup -H 'Content-Type: application/json' -d '{"username":"e2eadmin","password":"E2eSecret123","fullname":"E2E Admin"}') && break
            sleep 2
          done
          echo "$SEED" | grep -q '"success":true'
          # Warm the paths the specs hit first (cold debug builds answer
          # slowly; specs click through within tight timeouts).
          curl -sf http://localhost:8080/ -o /dev/null
          curl -sf http://localhost:8080/api/auth/setup-status -o /dev/null
          curl -sf "http://localhost:8080/api/auth/check-username?username=warmup_probe" -o /dev/null
      # Stage B — every other screen against the seeded server.
      # --retries=1 absorbs cold-start timing flakes (a cold debug build
      # shifts layout mid-click); failures that persist warm stay red.
      - name: E2E stage B — all screens except setup
        run: |
          E2E_DIRS=$(for d in tests/e2e/*/; do [ "$d" != "tests/e2e/setup/" ] && printf '%s ' "$d"; done)
          npx playwright test $E2E_DIRS --reporter=html --retries=1
      - name: Stop server
        if: always()
        run: |
          kill $(cat /tmp/hv-e2e.pid) || true
          # Post-mortem evidence for the next triage: free space, biggest
          # consumers, and the server log (journalctl / path_guard / sudo
          # errors land there, not in the playwright report).
          {
            df -h /
            echo '---'
            du -sh target node_modules frontend/node_modules playwright-report test-results /tmp/hv-e2e-data 2>/dev/null
          } > disk-report.txt || true
          cp /tmp/hv-e2e.log hv-e2e-server.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            hv-e2e-server.log
            disk-report.txt
