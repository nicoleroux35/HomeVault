name: Bug report
description: Report a reproducible HomeVault bug
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Release tag or commit SHA under test.
      placeholder: v1.0.0 / d8d0348
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend (Rust/Axum)
        - Frontend (Svelte)
        - Installer / systemd
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps, starting from a clean state where possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Redact secrets, tokens, and password hashes before pasting.
