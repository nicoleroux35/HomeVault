# HomeVault Optional Packages Reference
# This file documents all optional system packages by feature.
# The installer (install.sh) installs these packages automatically if detected.

[storage]
zfs = zfsutils-linux
btrfs = btrfs-progs
raid = mdadm
smart = smartmontools
ntfs = ntfs-3g
exfat = exfat-fuse, exfatprogs

[shares]
smb = samba
nfs = nfs-kernel-server
ftp = vsftpd
# WebDAV is served by HomeVault's own daemon (src/shares.rs
# homevault-webdav.py) — no external package needed.

[backup]
encryption = gnupg
incremental = rsync
archive = tar
checksum = coreutils

[docker]
engine = docker.io

[monitoring]
snmp = snmpd
ups = nut
sensors = lm-sensors

[acl]
acl = acl

[quota]
# Quota system - for disk usage limits per group
quota = quota
setquota = quota
repquota = quota

[email]
mutt = mutt
msmtp = msmtp

[network]
iproute2 = iproute2
wireless = wpasupplicant, wireless-tools

[downloader]
aria2 = aria2

[rclone]
rclone = rclone
fusermount = fuse3

[media]
# Required by src/handlers/media.rs for HLS transcoding of MKV/AVI/FLV
# and by src/handlers/dlna.rs to expose streams to UPnP renderers.
ffmpeg = ffmpeg
# Provides ffprobe (metadata extraction: duration, codec, resolution).
# Bundled with the ffmpeg package on Debian/Ubuntu.

[automount]
udisks2 = udisks2
udiskie = udiskie
