<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1E62AE" />
    <meta name="description" content="HomeVault - Dashboard de gestion pour serveur domestique" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="HomeVault" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Preload unified icon sprite (Lucide + Phosphor + Tabler) -->
    <link rel="preload" href="/sprite-unified.svg" as="image" type="image/svg+xml" />
    
    <title>HomeVault</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <!-- The backend replaces __HV_CSP_NONCE__ with the per-response nonce. The
         CSP no longer allows 'unsafe-inline', so an unstamped copy would simply
         not run. Keep the placeholder on every inline <script>. -->
    <script nonce="__HV_CSP_NONCE__">
      // Register Service Worker for PWA and offline support
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW registered:', registration.scope);
            })
            .catch((error) => {
              console.log('SW registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
